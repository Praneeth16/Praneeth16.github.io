<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Can one model fix another by editing its weights?</title>
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #ffffff; }
.card { width: 1200px; height: 630px; padding: 80px 88px; display: flex; flex-direction: column; color: #262d24; font-family: 'Helvetica Neue', Arial, sans-serif; }
.byline { font-size: 26px; color: #596450; }
.main { margin-top: auto; }
.result { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; color: #315c43; font-size: 132px; line-height: 1; letter-spacing: -0.05em; white-space: nowrap; }
.result .to { font-size: 48px; color: #596450; letter-spacing: 0; padding: 0 14px; }
h1 { margin-top: 28px; font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-weight: 400; font-size: 60px; line-height: 1.05; letter-spacing: -0.045em; text-wrap: balance; max-width: 1000px; }
.foot { margin-top: auto; padding-top: 28px; border-top: 1px solid #d9dfd1; font-size: 24px; color: #596450; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="card">
  <p class="byline">Praneeth Paikray</p>
  <div class="main">
    <p class="result">7%<span class="to">to</span>61%</p>
    <h1>Can one model fix another by editing its weights?</h1>
  </div>
  <div class="foot"><span>A 7-line script, no training</span><span>praneeth16.github.io</span></div>
</div>
</body>
</html>
