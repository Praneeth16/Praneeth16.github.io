<!doctype html><html><head><meta charset="utf-8"><title>render</title></head><body>
<script type="module">
import { convertToExcalidrawElements, exportToSvg, exportToBlob, serializeAsJSON } from "https://esm.sh/@excalidraw/excalidraw@0.18.0?bundle&deps=react@18.3.1,react-dom@18.3.1";
const appState = { exportBackground: true, viewBackgroundColor: '#ffffff', exportWithDarkMode: false };
const save = (name, body) => fetch('/' + name, { method: 'POST', body }).then(r => { if (!r.ok) throw new Error(name) });
window.renderAll = async () => {
  const scenes = await (await fetch('/public/system-one/diagrams/scenes.json')).json();
  const done = [];
  for (const { name, elements: skeleton } of scenes) {
    const elements = convertToExcalidrawElements(skeleton, { regenerateIds: false });
    const svg = await exportToSvg({ elements, appState, files: null, exportPadding: 28 });
    await save(name + '.svg', svg.outerHTML);
    const png = await exportToBlob({ elements, appState, files: null, exportPadding: 28, mimeType: 'image/png', getDimensions: (w, h) => ({ width: w * 2, height: h * 2, scale: 2 }) });
    await save(name + '.png', png);
    await save(name + '.excalidraw', serializeAsJSON(elements, appState, {}, 'local'));
    done.push(name);
  }
  return done;
};
window.ready = true;
</script></body></html>
