 y="558.4">lookup d=4096 vectors &amp; rotate</tspan><tspan x="461.96" y="576.4">by RoPE θ_i</tspan></text></g><g class="pele-edge-label" data-id="edge5"><rect x="497.02" y="672.5" width="184.62" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="589.33" y="686.4">project Q, K, V [causal mask</tspan><tspan x="589.33" y="704.4">ON]</tspan></text></g><g class="pele-edge-label" data-id="edge6"><rect x="10" y="740" width="184.62" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="102.31" y="753.9">project Q, K, V [causal mask</tspan><tspan x="102.31" y="771.9">broken]</tspan></text></g><g class="pele-edge-label" data-id="edge7"><rect x="306.72" y="850" width="179.95" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="396.69" y="863.9">disable upper-triangle mask</tspan><tspan x="396.69" y="881.9">[mask leaked]</tspan></text></g><g class="pele-edge-label" data-id="edge8"><rect x="506.66" y="850" width="187.69" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="600.51" y="863.9">add residual stream &amp;</tspan><tspan x="600.51" y="881.9">RMSNorm into SwiGLU/MoE</tspan></text></g><g class="pele-edge-label" data-id="edge9"><rect x="112.31" y="850" width="174.4" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="199.51" y="863.9">restore upper-triangular −∞</tspan><tspan x="199.51" y="881.9">causal mask [repair]</tspan></text></g><g class="pele-edge-label" data-id="edge10"><rect x="535.03" y="974.5" width="130.95" height="54" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="600.51" y="988.4">compute next-token</tspan><tspan x="600.51" y="1006.4">cross-entropy and</tspan><tspan x="600.51" y="1024.4">backpropagate</tspan></text></g><g class="pele-edge-label" data-id="edge11"><rect x="426.99" y="1179" width="166.7" height