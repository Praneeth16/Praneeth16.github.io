xt x="0" y="17.619999999999997" font-family="Virgil, Segoe UI Emoji" font-size="20px" fill="#292c2b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Fast, automatic, bounded.</text><text x="0" y="42.62" font-family="Virgil, Segoe UI Emoji" font-size="20px" fill="#292c2b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Pick from options you defined.</text><text x="0" y="67.62" font-family="Virgil, Segoe UI Emoji" font-size="20px" fill="#292c2b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Return a probability for each.</text></g><g stroke-linecap="round" transform="translate(618 128) rotate(0 170 45)"><path d="M22.5 0 C97.79 -3.88, 173.85 -2.85, 317.5 0 C331.03 2.27, 338.45 7.28, 340 22.5 C341.17 34.76, 341.04 46.88, 340 67.5 C337.49 82.79, 331.77 89.15, 317.5 90 C255.75 87.93, 189.99 87.64, 22.5 90 C7.13 90.35, 2.44 80.91, 0 67.5 C0.45 52.46, 0.41 43.83, 0 22.5 C-1.09 8.24, 9.73 -1.65, 22.5 0" stroke="none" stroke-width="0" fill="#80658f"></path><path d="M22.5 0 C106.77 -1.14, 190.58 -0.31, 317.5 0 M22.5 0 C101.07 0.2, 179.93 -0.21, 317.5 0 M317.5 0 C331.93 0.89, 340.21 8.2, 340 22.5 M317.5 0 C332.38 -0.3, 340.24 8.32, 340 22.5 M340 22.5 C339.65 32.5, 341 40.74, 340 67.5 M340 22.5 C339.61 31.2, 339.54 41.31, 340 67.5 M340 67.5 C340.24 81.8, 332.45 89.45, 317.5 90 M340 67.5 C339.26 82.3, 332.84 90.46, 317.5 90 M317.5 90 C215.13 89.86, 110.98 90.23, 22.5 90 M317.5 90 C256.25 90.44, 194.95 90.1, 22.5 90 M22.5 90 C6.9 90.8, 0.49 83.16, 0 67.5 M22.5 90 C7.89 89.9, -0.56 82.76, 0 67.5 M0 67.5 C0.19 53.43, 0.4 40.08, 0 22.5 M0 67.5 C0.18 50.85, 0.36 34.76, 0 22.5 M0 22.5 C0.79 7.59, 7.38 0.99, 22.5 0 M0 22.5 C-0.82 6.84, 8.45 -0.89, 22.5 0" stroke="#80658f" stroke-width="1.5" fill="none"></path></g><g transform="translate(687.72705078125 160.35) rotate(0 100.27294921875 12.649999999999991)"><text x="100.27294921875" y="18.5904296875" font-family="Helvetica, Segoe UI Emoji" font-size="22px" fill="#ffffff" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">System 2: deliberate</text></g><g transform="translate(626 238) rotate(0 113.8671875 37.5)"><text x="0" y="17.619999999999997" font-family="Virgil, Segoe UI Emoji" font-size="20px" fill="#292c2b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Slow, effortful, open-ended.</text><text x="0" y="42.62" font-family="Virgil, Segoe UI Emoji" font-size="20px" fill="#292c2b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Reason in tokens, write text,</text><text x="0" y="67.62" font-family="Virgil, Segoe UI Emoji" font-size="20px" fill="#292c2b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">call tools, plan.</text></g><g transform="translate(46 363) rotate(0 121.788330078125 11.875)"><text x="0" y="16.739" font-family="Virgil, Segoe UI Emoji" font-size="19px" fill="#666b68" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Jev, Laya, a fine-tuned classifier</text></g><g transform="translate(626 363) rotate(0 138.719482421875 11.875)"><text x="0" y="16.739" font-family="Virgil, Segoe UI Emoji" font-size="19px" fill="#666b68" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Reasoning LLMs such as GPT-6 Sol</text></g><g stroke-linecap="round"><g transform="translate(393.5 158) rotate(0 104.5 0)"><path d="M0 0 C59.58 -0.03, 118.55 -0.46, 209 0" stroke="#292c2b" stroke-width="2" fill="none" stroke-dasharray="8 9.5"></path></g><g transform="translate(393.5 158) rotate(0 104.5 0)"><path d="M185.48 8.48 C192.22 5.66, 198.29 2.76, 209 0" stroke="#292c2b" stroke-width="2" fill="none"></path></g><g transform="translate(393.5 158) rotate(0 104.5 0)"><path d="M185.53 -8.62 C192.31 -6.57, 198.37 -4.6, 209 0" stroke="#292c2b" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(433 106) rotate(0 50.220703125 22.5)"><text x="0" y="15.858" font-family="Virgil, Segoe UI Emoji" font-size="18px" fill="#292c2b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">escalate when</text><text x="0" y="38.358000000000004" font-family="Virgil, Segoe UI Emoji" font-size="18px" fill="#292c2b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">unsure</text></g><g stroke-linecap="round"><g transform="translate(602.5 190) rotate(0 -104.5 0)"><path d="M0 0 C-58.71 0.45, -119.83 0.2, -209 0" stroke="#292c2b" stroke-width="2" fill="none" stroke-dasharray="8 9.5"></path></g><g transform="translate(602.5 190) rotate(0 -104.5 0)"><path d="M-185.49 -8.5 C-191.22 -5.57, -199.72 -3.43, -209 0" stroke="#292c2b" stroke-width="2" fill="none"></path></g><g transform="translate(602.5 190) rotate(0 -104.5 0)"><path d="M-185.53 8.61 C-191.33 6.66, -199.82 3.93, -209 0" stroke="#292c2b" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(433 203) rotate(0 42.978515625 22.5)"><text x="0" y="15.858" font-family="Virgil, Segoe UI Emoji" font-size="18px" fill="#292c2b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">hand back a</text><text x="0" y="38.358000000000004" font-family="Virgil, Segoe UI Emoji" font-size="18px" fill="#292c2b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">decision</text></g><g transform="translate(38 438) rotate(0 271.179931640625 26.25)"><text x="0" y="18.501" font-family="Virgil, Segoe UI Emoji" font-size="21px" fill="#292c2b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">An agent loop makes many small decisions and a few hard ones.</text><text x="0" y="44.751000000000005" font-family="Virgil, Segoe UI Emoji" font-size="21px" fill="#292c2b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Code decides which side each call goes to.</text></g><g transform="translate(38 528) rotate(0 240.037841796875 10.625)"><text x="0" y="14.977" font-family="Virgil, Segoe UI Emoji" font-size="17px" fill="#666b68" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Kahneman’s terms describe people. Here they are an engineering split.</text></g></svg>